<!DOCTYPE html>
<html>
<head><title>Authenticating...</title></head>
<body>
<script>
// Minimal MSAL popup handler — reads hash from URL and posts to opener
(function() {
  // Tell the parent window MSAL can process the response
  if (window.opener) {
    // MSAL listens for storage events and window messages
    // Just posting the hash back is enough for popup flow
    try {
      window.opener.postMessage(
        { type: "msal:popupHashChanged", hash: window.location.hash + window.location.search },
        window.location.origin
      );
    } catch(e) {}
  }
})();
</script>
</body>
</html>
